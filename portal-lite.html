.filter-chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}
.chip{padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13.5px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.chip:hover{color:var(--text);border-color:rgba(232,182,76,.4)}
.chip.active{background:var(--grad-gold);color:#221703;border-color:transparent;box-shadow:0 6px 20px rgba(232,182,76,.3)}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:10px}
.calc-grid.collapsed .calc-card:nth-child(n+9){display:none}
.calc-more{display:flex;justify-content:center;margin-top:18px}
.calc-more .btn svg{transition:transform .3s}
.calc-more .btn.open svg{transform:rotate(180deg)}
.sec-acc{border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.sec-acc>summary{list-style:none;display:flex;align-items:center;gap:11px;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s}
.sec-acc>summary::-webkit-details-marker{display:none}
.sec-acc>summary:hover{background:rgba(232,182,76,.06)}
.sec-acc>summary>svg{color:var(--gold)}
.sec-acc .acc-badge{margin-left:auto;font-size:11.5px;font-weight:700;color:#221703;background:var(--grad-gold);border-radius:8px;padding:3px 9px}
.sec-acc .acc-chev{margin-left:10px;transition:transform .3s;color:var(--muted)}
.sec-acc[open] .acc-chev{transform:rotate(180deg)}
.sec-acc[open]>summary{border-bottom:1px solid var(--line)}
.sec-acc .sec-acc-in{padding-top:16px}
.acc-flat{background:transparent;border:none;border-radius:0}
.acc-flat>summary{padding:12px 2px;font-size:14.5px}
.acc-flat[open]>summary{border-bottom:1px solid var(--line)}
.calc-card{position:relative;display:flex;flex-direction:column;gap:6px;padding:13px 15px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s,opacity .25s}
.calc-card:hover{transform:translateY(-5px);border-color:rgba(232,182,76,.45);box-shadow:var(--glow)}
.calc-card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 140px at var(--mx,50%) var(--my,0%),rgba(232,182,76,.10),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.calc-card:hover::before{opacity:1}
.calc-icon{width:50px;height:50px;border-radius:14px;background:var(--panel-strong);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.calc-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calc-desc{font-size:12px;color:var(--muted);flex-grow:1}
.calc-go{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--gold);margin-top:4px}
.calc-card:hover .calc-go{gap:10px}
.calc-go{transition:gap .2s}
.hot-tag{font-size:10px;font-weight:700;letter-spacing:.06em;color:#221703;background:var(--grad-gold);border-radius:999px;padding:2.5px 9px}
.new-tag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--green);border:1px solid rgba(79,213,141,.4);border-radius:999px;padding:2.5px 9px}
.empty-note{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
.planner-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:30px;align-items:center}
.planner-form{display:flex;flex-direction:column;gap:18px;margin-top:24px}
.planner-form label{display:flex;flex-direction:column;gap:9px;font-size:14px;font-weight:700;color:var(--muted)}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;color:var(--muted)}
.lbl-row b{color:var(--gold2);font-size:16px}
.planner-form select{padding:13px 16px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14.5px;font-family:inherit;outline:none}
.planner-form select:focus{border-color:rgba(232,182,76,.55)}
.planner-form label b{color:var(--gold2)}
input[type="range"]{-webkit-appearance:none;appearance:none;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--gold) var(--fill,30%),rgba(255,255,255,.14) var(--fill,30%));outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:23px;height:23px;border-radius:50%;background:var(--grad-btn);border:3px solid #1a1204;box-shadow:0 3px 14px rgba(232,182,76,.6);cursor:grab}
input[type="range"]::-moz-range-thumb{width:23px;height:23px;border-radius:50%;background:var(--grad-btn);border:3px solid #1a1204;box-shadow:0 3px 14px rgba(232,182,76,.6);cursor:grab}
.planner-result{border-radius:16px;padding:20px 22px;background:linear-gradient(150deg,rgba(232,182,76,.15),rgba(232,182,76,.05));border:1px solid rgba(232,182,76,.4)}
.planner-result .big{font-size:clamp(26px,3vw,36px);font-weight:700;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.planner-result .small{font-size:13px;color:var(--muted);margin-top:5px}
.planner-visual{position:relative;min-height:290px;display:flex;align-items:center;justify-content:center}
.planner-frame{width:min(330px,94%);border-radius:24px}
.planner-frame .planner-img{position:static;width:100%;height:auto;max-height:330px;border-radius:24px;border:1px solid rgba(232,182,76,.22)}
.coin-sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.coin{position:absolute;top:-34px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffe9b0,#e8b64c 55%,#b5842a);box-shadow:0 0 12px rgba(232,182,76,.65),inset 0 -3px 5px rgba(120,80,10,.55);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#7a5410;animation:coinFall linear forwards}
@keyframes coinFall{to{transform:translateY(115vh) rotate(340deg);opacity:.15}}
.chart-band{margin-top:0;display:grid;grid-template-columns:1.65fr 1fr;gap:16px;border-radius:18px;padding:14px;background:var(--panel);border:1px solid var(--line)}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.chart-head h3{font-size:16px}
.chart-head p{font-size:12.5px;color:var(--muted);margin-top:4px}
.chart-badge{flex:none;font-weight:700;font-size:12px;color:#221703;background:var(--grad-gold);border-radius:11px;padding:5px 11px}
.chart-box{position:relative}
.chart-box svg{width:100%;height:auto;display:block}
.chart-grid-l{stroke:rgba(255,255,255,.07);stroke-width:1}
html[data-theme="light"] .chart-grid-l{stroke:rgba(15,30,60,.09)}
.chart-ylab{fill:var(--muted);font-size:9px;font-weight:600}
.chart-year{fill:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em}
.rate-area{fill:url(#rateGrad);opacity:0;transition:opacity 1s ease .5s}
.chart-band.drawn .rate-area{opacity:1}
.rate-line{fill:none;stroke:url(#rateStroke);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rate-dot{fill:var(--gold2);stroke:#3a2a08;stroke-width:2;opacity:0;transition:opacity .4s ease 1.7s}
.chart-band.drawn .rate-dot{opacity:1}
.rate-dot-pulse{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:0;transform-origin:center;transform-box:fill-box;animation:ringPulse 2.2s ease-out infinite 1.9s}
.chart-band.drawn .rate-dot-pulse{opacity:.8}
@keyframes ringPulse{0%{transform:scale(.5);opacity:.8}80%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.hover-line{stroke:rgba(232,182,76,.45);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.hover-dot{fill:#fff;stroke:var(--gold);stroke-width:2.4;opacity:0;transition:opacity .15s}
.chart-tip{position:absolute;pointer-events:none;background:var(--bg2);border:1px solid rgba(232,182,76,.45);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;transform:translate(-50%,-130%);white-space:nowrap;transition:opacity .15s;z-index:2}
.chart-tip b{color:var(--gold2)}
.chart-legend{display:flex;gap:20px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.lg-gold{background:var(--gold);box-shadow:0 0 8px rgba(232,182,76,.8)}
.lg-red{background:var(--red)}
.chart-hint{margin-left:auto;font-size:11.5px;color:var(--muted);opacity:.8}
.chart-rings{display:flex;flex-direction:column;gap:12px}
.ring-card{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--panel-strong);border:1px solid var(--line)}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}
html[data-theme="light"] .ring-bg{stroke:rgba(15,30,60,.1)}
.ring-fg{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.4s cubic-bezier(.3,.7,.3,1) .3s;filter:drop-shadow(0 0 5px rgba(232,182,76,.5))}
.ring-fg.ring-blue{stroke:var(--blue);filter:drop-shadow(0 0 5px rgba(94,162,255,.5))}
.ring-fg.ring-green{stroke:var(--green);filter:drop-shadow(0 0 5px rgba(79,213,141,.5))}
.ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--gold2)}
.ring-card>b{font-size:13px;line-height:1.35}
.ring-card>b span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.sol-feature{display:grid;grid-template-columns:1fr 1.05fr;gap:0;border-radius:24px;overflow:hidden;border:1px solid rgba(232,182,76,.3);background:linear-gradient(120deg,rgba(232,182,76,.1),rgba(232,182,76,.02) 55%);margin-bottom:18px;position:relative}
.sol-feat-img{position:relative;min-height:220px}
.sol-feat-img .photo-frame{position:absolute;inset:12px}
.sol-feat-body{padding:20px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:13px}
.sol-feat-body h3{font-size:21px}
.sol-feat-body p{font-size:14px;color:var(--muted)}
.feat-chips{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.feat-chip{display:flex;flex-direction:column;padding:9px 15px;border-radius:13px;background:var(--panel-strong);border:1px solid var(--line)}
.feat-chip b{font-size:14px;color:var(--gold2)}
.feat-chip span{font-size:10.5px;color:var(--muted)}
.pen-band{display:grid;grid-template-columns:.9fr 1.1fr;gap:0;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(100deg,var(--panel),rgba(232,182,76,.07))}
.pen-visual{position:relative;min-height:260px}
.pen-visual .photo-frame{position:absolute;inset:14px}
.pen-float{position:absolute;display:flex;flex-direction:column;gap:1px;padding:12px 17px;border-radius:15px;background:rgba(10,17,34,.72);border:1px solid rgba(232,182,76,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 34px rgba(2,6,18,.5);animation:floaty 6s ease-in-out infinite}
html[data-theme="light"] .pen-float{background:rgba(255,255,255,.9)}
.pen-float b{font-size:15px;color:var(--gold2)}
.pen-float span{font-size:11px;color:var(--muted)}
.pen-float-a{top:12%;left:2%}
.pen-float-b{bottom:14%;right:6%;animation-delay:1.6s}
.pen-copy{padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;align-items:flex-start;gap:10px;justify-content:center}
.pen-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:10px}
.cyber-visual{position:absolute;right:26px;top:26px;width:120px;border-radius:20px;border:1px solid rgba(232,182,76,.4);box-shadow:var(--shadow-lg),var(--glow);animation:floaty 7s ease-in-out infinite;z-index:2}
.cyber-visual img{border-radius:20px;display:block}
.sol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}
.sol-card{border-radius:var(--radius);padding:23px;background:var(--panel);border:1px solid var(--line);position:relative;transition:transform .22s,border-color .22s}
.sol-card:hover{transform:translateY(-4px);border-color:rgba(232,182,76,.4)}
.sol-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:4px 11px;border-radius:999px;margin-bottom:14px}
.sol-tag.up{color:var(--green);background:rgba(79,213,141,.12)}
.sol-tag.info{color:var(--blue);background:rgba(94,162,255,.13)}
.sol-card h3{margin-bottom:9px;font-size:17.5px;display:flex;align-items:center;gap:10px}
.sol-ic{display:inline-flex;color:var(--gold);flex:none}
.sol-card p{font-size:13.5px;color:var(--muted)}
.sol-meta{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center}
.sol-meta a{color:var(--gold);font-weight:700}
.live-badge{align-self:center;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--green);border:1px solid rgba(79,213,141,.4);border-radius:999px;padding:6px 14px;animation:pulse 2.4s infinite}
.cyber-card{border-radius:26px;padding:clamp(16px,3vw,28px);background:linear-gradient(160deg,rgba(94,162,255,.10),rgba(255,255,255,.03) 55%);border:1px solid rgba(94,162,255,.28);position:relative;overflow:hidden}
.cyber-mark{position:absolute;right:-50px;bottom:-70px;width:260px;height:260px;color:var(--blue);opacity:.07;transform:rotate(-14deg);pointer-events:none}
.cyber-mark svg{width:100%;height:100%}
.cyber-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:26px}
.cyber-head>div{flex:1;min-width:240px}
.cyber-head h2{margin-bottom:10px}
.cyber-head p{color:var(--muted);font-size:14.5px;max-width:640px}
.cyber-shield{width:62px;height:62px;border-radius:18px;background:rgba(94,162,255,.14);border:1px solid rgba(94,162,255,.4);display:flex;align-items:center;justify-content:center;color:var(--blue);flex:none}
.cyber-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px;position:relative;z-index:1}
.cyber-item{border-radius:16px;padding:19px;background:rgba(7,13,28,.55);border:1px solid var(--line);display:flex;flex-direction:column;gap:9px;transition:border-color .2s,transform .2s}
html[data-theme="light"] .cyber-item{background:rgba(255,255,255,.75)}
.cyber-item:hover{border-color:rgba(94,162,255,.5);transform:translateY(-3px)}
.cyber-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.05em}
.cyber-kind{color:var(--blue);display:inline-flex;align-items:center;gap:6px}
.cyber-date{color:var(--muted)}
.cyber-item h3{font-size:15.5px}
.cyber-item p{font-size:13px;color:var(--muted)}
.cyber-link{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:auto}
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.guide-card{border-radius:22px;padding:28px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;transition:border-color .22s,transform .22s}
.guide-card:hover{border-color:rgba(232,182,76,.4);transform:translateY(-4px)}
.guide-num{font-size:26px;font-weight:700;color:rgba(232,182,76,.28);letter-spacing:.03em}
.guide-card p{font-size:14px;color:var(--muted);flex-grow:1}
.guide-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:auto}
.guide-tips{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.guide-img-card{padding:12px;overflow:hidden;min-height:300px}
.guide-img-card .photo-frame{position:absolute;inset:12px;border-radius:16px}
.article-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.article-mini{display:flex;flex-direction:column;gap:6px;padding:20px 24px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.article-mini:hover{border-color:rgba(232,182,76,.45);transform:translateY(-3px)}
.article-mini b{font-size:15.5px}
.article-mini span{font-size:13px;color:var(--muted)}
.sub-card{border-radius:28px;padding:clamp(18px,3vw,32px);text-align:center;background:
  radial-gradient(600px 240px at 50% -30%,rgba(232,182,76,.18),transparent 70%),
  var(--panel);border:1px solid rgba(232,182,76,.3)}
.sub-card h2{margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:12px}
.h2-ic{display:inline-flex;color:var(--gold)}
.sub-card>p{color:var(--muted);max-width:560px;margin:0 auto 26px;font-size:15px}
.sub-form{display:flex;gap:10px;max-width:470px;margin:0 auto;flex-wrap:wrap}
.sub-form input{flex:1;min-width:220px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:.2s}
.sub-form input:focus{border-color:rgba(232,182,76,.55);box-shadow:var(--glow)}
.sub-note{font-size:12.5px;color:var(--muted);margin-top:16px}
.sub-success{display:none;flex-direction:column;align-items:center;gap:10px}
.sub-success.show{display:flex;animation:fadeDown .4s ease}
.sub-success .ok{font-size:44px}
.faq-wrap{max-width:820px}
.faq-list{display:flex;flex-direction:column;gap:8px}
.faq-list details{border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:border-color .2s}
.faq-list details[open]{border-color:rgba(232,182,76,.4)}
.faq-list summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 18px;font-weight:600;font-size:14.5px;cursor:pointer}
.faq-list summary::-webkit-details-marker{display:none}
.faq-x{position:relative;width:16px;height:16px;flex:none}
.faq-x::before,.faq-x::after{content:"";position:absolute;background:var(--gold);border-radius:2px;transition:.25s}
.faq-x::before{left:0;top:7px;width:16px;height:2px}
.faq-x::after{left:7px;top:0;width:2px;height:16px}
details[open] .faq-x::after{transform:rotate(90deg);opacity:0}
.faq-list details p{padding:0 24px 20px;color:var(--muted);font-size:14.5px}
.site-footer{border-top:1px solid var(--line);background:var(--bg2);padding:52px 0 40px;position:relative}
html[data-theme="light"] .site-footer{background:#e6eaf3}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px}
.foot-brand p{font-size:13.5px;color:var(--muted);margin-top:14px;max-width:320px}
.foot-mini{font-size:12.5px!important;margin-top:18px!important}
.foot-col{display:flex;flex-direction:column;gap:10px}
.foot-col h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.foot-col a{font-size:14px;color:var(--muted);transition:.2s}
.foot-col a:hover{color:var(--text)}
.to-top{position:absolute;right:28px;top:44px;width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;transition:.2s}
.to-top:hover{border-color:rgba(232,182,76,.5);transform:translateY(-3px)}
.modal{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-back{position:absolute;inset:0;background:rgba(3,7,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-card{position:relative;width:min(430px,100%);border-radius:24px;padding:32px;background:var(--bg2);border:1px solid rgba(232,182,76,.3);box-shadow:var(--shadow-lg),var(--glow);animation:popIn .3s cubic-bezier(.2,.9,.3,1.2);text-align:center}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.modal-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px}
.modal-icon{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;background:rgba(232,182,76,.14);border:1px solid rgba(232,182,76,.4);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.modal-sub{font-size:13.5px;color:var(--muted);margin:10px 0 16px}
.modal-date{font-weight:700;font-size:15px;background:rgba(232,182,76,.12);border:1px dashed rgba(232,182,76,.45);border-radius:12px;padding:10px;margin-bottom:16px}
.rem-opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-bottom:10px;font-size:14px;transition:.2s}
.rem-opt:hover{border-color:rgba(232,182,76,.5)}
.rem-ic{display:inline-flex;color:var(--gold);flex:none}
.rem-opt div{flex:1;display:flex;flex-direction:column}
.rem-opt div span{font-size:11.5px;color:var(--muted)}
.rem-opt i{font-style:normal;color:var(--gold);font-weight:700}
.fab{position:fixed;right:22px;bottom:22px;z-index:1500;width:56px;height:56px;border-radius:50%;background:var(--grad-btn);color:#221703;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(232,182,76,.5);transition:transform .2s,opacity .3s;opacity:0;pointer-events:none;transform:translateY(14px)}
.fab.show{opacity:1;pointer-events:auto;transform:none}
.fab:hover{transform:scale(1.09)}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
@media (max-width:1180px){
  .brand-tag{display:none}
}
@media (max-width:1020px){
  .dash-grid{grid-template-columns:repeat(2,1fr)}
  .chart-band{grid-template-columns:1fr}
  .sol-feature{grid-template-columns:minmax(0,1fr)}
  .sol-feature>*{min-width:0}
  .sol-feat-img{min-height:210px}
  .sol-feat-body .btn{white-space:normal}
  .cyber-visual{display:none}
  .pen-band{grid-template-columns:1fr}
  .pen-visual{min-height:250px}
  .planner-grid{grid-template-columns:minmax(0,1fr);gap:26px}
  .planner-grid>*{min-width:0}
  .planner-form select{width:100%;min-width:0}
  .cyber-mark{display:none}
  .guide-grid{grid-template-columns:1fr 1fr}
  .guide-img-card{display:none}
  .foot-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .hero-media{height:390px}
  .hero-photo{object-position:center 45%}
  .hero-chips{bottom:10px;gap:6px;padding:0 10px}
  .glass-chip{padding:7px 9px}
  .glass-chip b{font-size:14px}
  .glass-chip span{font-size:9px}
  .chip-trend{font-size:9px}
  .header-in{gap:9px}
  .brand{font-size:18px;gap:8px}
  .brand-icon{width:30px;height:30px}
  .lang-seg{gap:10px}
  .lang-seg-btn{font-size:10px;letter-spacing:.12em}
  .theme-toggle{width:36px;height:36px}
  .top-nav{display:none}
  .brand-tag{display:none}
  .burger{display:flex}
  .hide-mobile{display:none}
  .hero{padding-top:48px}
  .hero-stats{grid-template-columns:repeat(2,auto);gap:20px 34px;width:100%}
  .section{padding:30px 0}
  .section-head{flex-direction:column;align-items:flex-start}
  .guide-grid{grid-template-columns:1fr}
  .article-row{grid-template-columns:1fr}
  .chip-c{display:none}
  .chip-a{left:2%}
  .chip-b{right:2%}
  .pen-float-a{left:2%}
  .pen-float-b{right:2%}
  .chart-hint{margin-left:0}
  .to-top{position:static;margin-top:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (max-width:640px){
  .hero-body{padding-top:24px}
  .hero-stats{gap:18px 26px}
  .btn{white-space:normal}
  .lang-seg{gap:12px}
  .lang-seg-btn{padding:4px 0;font-size:10.5px;letter-spacing:.14em}
  .hero{padding:0 0 30px}
  .hero-cta .btn{width:100%}
  .sec-acc>summary{font-size:13px;padding:11px 13px;gap:8px}
  .sec-acc .acc-badge{font-size:10px;padding:2px 6px}
  .dash-val{font-size:18px}
  .dash-lbl{font-size:10.5px}
  .dash-note{font-size:11px}
  .dash-card{padding:10px 12px}
  .dash-chart{padding:6px 8px 4px}
  .dash-spark{height:26px}
  .pay-card{padding:12px 13px}
  .calc-title{font-size:13.5px}
}

</style>

}

}

function sparkPath(vals, w, h){
  const min = Math.min(...vals), max = Math.max(...vals), rng = (max - min) || 1;

  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1, i+2)];
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ' C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
  }
  return d;
}

    requestAnimationFrame(() => requestAnimationFrame(() => { fg.style.strokeDashoffset = (C * (1 - pct)).toFixed(1); }));
    const target = parseFloat(label.replace(/[^\d.,]/g, '').replace(',', '.')) || 0;
    const prefix = label.startsWith('+') ? '+' : '';
    const t0 = performance.now();
    (function tick(t){
      const p = Math.min(1, (t - t0) / 1200), e2 = 1 - Math.pow(1 - p, 3);
      const out = curLang === 'en' ? (target * e2).toFixed(1) : (target * e2).toFixed(1).replace('.', ',');
      val.textContent = prefix + out + '%';
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  });
}
function renderSolutions(){
  const el = $('#solGrid'); if (!el) return;
  el.innerHTML = SOLUTIONS.map(s => `
    <div class="sol-card reveal">
      <span class="sol-tag ${s.tag}">${tx(s.tagText)}</span>
      <h3><span class="sol-ic">${ico(s.icon, 19)}</span>${tx(s.t)}</h3>
      <p>${tx(s.p)}</p>
      <div class="sol-meta"><span>${tx(s.date)}</span><a href="${u(s.link)}">${tx(s.linkText)}</a></div>
    </div>`).join('');
  observeReveals();
}
function renderCyber(){
  const el = $('#cyberGrid'); if (!el) return;
  el.innerHTML = CYBER.map(c => `
    <div class="cyber-item reveal">
      <div class="cyber-top"><span class="cyber-kind">${ico(c.icon,14)} ${tx(c.kind)}</span><span class="cyber-date">${c.date}</span></div>
      <h3>${tx(c.t)}</h3>
      <p>${tx(c.p)}</p>
      <span class="cyber-link">${L('cyber_link')}</span>
    </div>`).join('');
  observeReveals();
}
let coinTimer = null;
function calcPlan(){
  const sel = $('#goalSelect'), mr = $('#monthRange'), yr = $('#yearRange');
  if (!sel || !mr || !yr) return;
  const g = GOALS[sel.value];
  const m = +mr.value, yrs = +yr.value, months = yrs * 12;
  let sum = 0;
  for (let i = 1; i <= months; i++) sum = (sum + m) * (1 + g.rate / 12);
  const invested = m * months;
  const tax = (sum - invested) * (g.tax || 0);
  const net = sum - tax;
  $('#monthVal').textContent = fmt(m) + ' ₪';
  $('#yearVal').textContent = yrs + ' ' + yearWord(yrs);
  [mr, yr].forEach(r => { const p = (r.value - r.min) / (r.max - r.min) * 100; r.style.setProperty('--fill', p + '%'); });
  const taxPct = Math.round(g.tax * 100);
  const netLabel = g.tax
    ? (curLang === 'ru' ? `чистыми после налога ${taxPct}%` : curLang === 'fr' ? `net d’impôt de ${taxPct} %` : `net of ${taxPct}% tax`)
    : (curLang === 'ru' ? 'чистыми' : 'net');
  $('#plannerResult').innerHTML = `
    <div class="small">${tx(g.name)} · ${months} ${L('r_months')} · ${L('r_deposit')} ${fmt(invested)} ₪</div>
    <div class="big">${fmt(net)} ₪</div>
    <div class="small">${netLabel} · ${L('r_income')} <b style="color:var(--gold2)">${fmt(net - invested)} ₪</b></div>
    <div class="small" style="margin-top:8px">${L('r_tip')} ${tx(g.hint)}</div>`;
}
function spawnCoin(){
  const sky = $('#coinSky'); if (!sky) return;
  const c = document.createElement('span');
  c.className = 'coin'; c.textContent = '₪';
  c.style.left = Math.random() * 96 + '%';
  const dur = 2.6 + Math.random() * 2.4;
  c.style.animationDuration = dur + 's';
  c.style.fontSize = (12 + Math.random() * 8) + 'px';
  sky.appendChild(c);
  setTimeout(() => c.remove(), dur * 1000 + 200);
}
function startCoins(){ if (coinTimer) return; spawnCoin(); spawnCoin(); coinTimer = setInterval(spawnCoin, 340); }
function showSubSuccess(em){
  const card = $('.sub-card'); if (!card) return;
  card.querySelector('h2').innerHTML = `${ico('badge', 30)} ${L('sub_ok_h')}`;
  card.querySelector('p').innerHTML = L('sub_ok_s').replace('{email}', em);
  const form = card.querySelector('.sub-form');
  if (form) form.style.display = 'none';
  const note = $('#subNote');
  if (note) note.textContent = L('sub_ok_note');
}
function initSub(){
  const form = $('#subForm'); if (!form) return;
  const saved = LS.get('shekelpro_sub');
  if (saved) showSubSuccess(saved);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const em = $('#subEmail').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) { $('#subEmail').focus(); return; }
    LS.set('shekelpro_sub', em);
    showSubSuccess(em);
  });
}
function animateCount(el){
  const target = +el.dataset.count, suf = el.dataset.suffix || '';
  const t0 = performance.now(), dur = 1300;
  function tick(t){
    const p = Math.min(1, (t - t0) / dur), ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * ease) + suf;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
let io = null;
function observeReveals(){
  const sel = '.reveal:not(.in), .zoom-img:not(.in)';
  if (!('IntersectionObserver' in window)){ $$('.reveal, .zoom-img').forEach(e => e.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold:.12 });
  $$(sel).forEach(e => io.observe(e));
}
function initParallax(){
  const els = [...document.querySelectorAll('[data-plx]')];
  if (!els.length) return;
  if (window.matchMedia && (matchMedia('(prefers-reduced-motion: reduce)').matches || matchMedia('(hover: none)').matches && innerWidth < 760)) return;
  let ticking = false;
  const upd = () => {
    ticking = false;
    const vh = innerHeight;
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.bottom < -140 || r.top > vh + 140) return;
      const off = (r.top + r.height / 2 - vh / 2) * parseFloat(el.dataset.plx);
      el.style.transform = `translate3d(0, ${off.toFixed(1)}px, 0)`;
    });
  };
  window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(upd); } }, { passive:true });
  upd();
}
function initTilt(){
  if (window.matchMedia && (matchMedia('(prefers-reduced-motion: reduce)').matches || !matchMedia('(hover: hover)').matches)) return;
  document.addEventListener('mousemove', e => {
    const t = e.target.closest('.tilt'); if (!t) return;
    const r = t.getBoundingClientRect();
    const rx = ((e.clientY - r.top) / r.height - .5) * -4.5;
    const ry = ((e.clientX - r.left) / r.width - .5) * 5.5;
    t.style.transform = `perspective(950px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
  }, { passive:true });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest('.tilt');
    if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) t.style.transform = '';
  }, { passive:true });
}
function renderAll(){
  renderDash(); renderTicker(); renderPayments(); renderChips(); renderCalcs(); renderSolutions(); renderCyber();
  renderRateChart(); renderRings();
  renderBadge();
}
function setLang(l){
  if (['ru','fr','en'].indexOf(l) === -1) return;
  curLang = l;
  LS.set('shekelpro_lang', l);
  applyStatic();
  renderAll();
  calcPlan();
  const menu = $('#langMenu'); if (menu) menu.hidden = true;
  const lb = $('#langBtn'); if (lb) lb.setAttribute('aria-expanded', 'false');
}
document.addEventListener('DOMContentLoaded', () => {
  curLang = LS.get('shekelpro_lang') || 'ru';
  initIcons();
  applyStatic();
  const cAcc = $('#chartAcc');
  if (cAcc) cAcc.addEventListener('toggle', () => { if (cAcc.open && !cAcc.dataset.drawn){ cAcc.dataset.drawn = '1'; renderRateChart(); } });
  renderAll(); bindChips(); initSub(); calcPlan();
  observeReveals(); initParallax(); initTilt();
  fetchLive();
  const root = document.documentElement;
  const tt = $('#themeToggle');
  const syncTheme = () => tt.innerHTML = root.dataset.theme === 'light' ? ico('sun',17) : ico('moon',17);
  if (LS.get('shekelpro_theme') === 'light') root.dataset.theme = 'light';
  syncTheme();
  tt.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    LS.set('shekelpro_theme', root.dataset.theme === 'light' ? 'light' : 'dark');
    syncTheme();
  });
  const lb = $('#langBtn'), lm = $('#langMenu');
  if (lb && lm){
    lb.addEventListener('click', e => {
      e.stopPropagation();
      const open = !lm.hidden;
      lm.hidden = open;
      lb.setAttribute('aria-expanded', String(!open));
    });
    document.addEventListener('click', e => {
      if (!lm.hidden && !e.target.closest('.lang-wrap')){ lm.hidden = true; lb.setAttribute('aria-expanded', 'false'); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lm.hidden){ lm.hidden = true; lb.setAttribute('aria-expanded', 'false'); } });
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (b) setLang(b.dataset.lang);
  });
  const header = $('#siteHeader'), bar = $('#scrollProgress'), fab = $('#plannerFab'), toTop = $('#toTop');
  window.addEventListener('scroll', () => {
    const y = window.scrollY, h = document.documentElement.scrollHeight - innerHeight;
    header.classList.toggle('scrolled', y > 10);
    bar.style.width = (h > 0 ? y / h * 100 : 0) + '%';
    fab.classList.toggle('show', y > 600);
  }, { passive:true });
  if (toTop) toTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));
  if (fab) fab.addEventListener('click', e => {
    e.preventDefault();
    const acc = $('#planAcc'); if (acc) acc.open = true;
    $('#planner').scrollIntoView({ behavior:'smooth' });
  });
  const burger = $('#burger'), mm = $('#mobileMenu');
  burger.addEventListener('click', () => {
    const open = mm.classList.toggle('show');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open);
  });
  mm.addEventListener('click', e => { if (e.target.tagName === 'A'){ mm.classList.remove('show'); burger.classList.remove('open'); } });
  const search = $('#calcSearch');
  search.addEventListener('input', () => { curQuery = search.value; renderCalcs(); });
  const cmb = $('#calcMoreBtn');
  if (cmb) cmb.addEventListener('click', () => {
    calcExpanded = !calcExpanded;
    cmb.classList.toggle('open', calcExpanded);
    syncCalcCollapse();
    observeReveals();
  });
  document.addEventListener('mousemove', e => {
    const card = e.target.closest('.calc-card'); if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  }, { passive:true });
  ['#goalSelect', '#monthRange', '#yearRange'].forEach(s => {
    const el = $(s);
    if (el){ el.addEventListener('input', calcPlan); el.addEventListener('change', calcPlan); }
  });
  ['#heroPlannerBtn', '#plannerBtn2'].forEach(s => {
    const b = $(s); if (b) b.addEventListener('click', () => {
      const acc = $('#planAcc'); if (acc) acc.open = true;
      $('#planner').scrollIntoView({ behavior:'smooth' });
    });
  });
  const planner = $('#planner');
  if (planner){
    if ('IntersectionObserver' in window){
      const po = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ startCoins(); po.disconnect(); } }), { threshold:.25 });
      po.observe(planner);
    } else startCoins();
  }
  const modals = [$('#remModal'), $('#planModal')];
  const closeAll = () => { modals.forEach(m => { if (m && !m.hidden){ m.hidden = true; document.body.style.overflow = ''; } }); };
  document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeAll(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
  const pg = $('#planModalGo'); if (pg) pg.addEventListener('click', () => closeAll());
  const hs = $('.hero-stats');
  if (hs){
    if ('IntersectionObserver' in window){
      const co = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ $$('.hero-stats dt').forEach(animateCount); co.disconnect(); } }), { threshold:.4 });
      co.observe(hs);
    } else $$('.hero-stats dt').forEach(animateCount);
  }
  setTimeout(() => $$('.reveal:not(.in), .zoom-img:not(.in)').forEach(e => e.classList.add('in')), 1200);
});

</script>
