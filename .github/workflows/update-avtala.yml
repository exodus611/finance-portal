name: Avtala — auto update

on:
  schedule:
    - cron: '40 5 * * 1'      # еженедельно, пн 05:40 UTC
    - cron: '40 5 2 1 *'      # 2 января — когда государство обновляет ставки
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Установить зависимости
        run: pip install openpyxl

      - name: Обновить данные
        id: run
        continue-on-error: true
        run: python scripts/avtala_auto_update.py | tee /tmp/out.txt

      - name: Проверить расчёт
        run: python scripts/test_avtala_calc.py

      - name: Пересобрать статичную разметку для поисковых роботов
        run: python scripts/avtala_prerender.py

      - name: Закоммитить
        run: |
          git config user.name  "avtala-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/avtala.json avtala.html
          git diff --staged --quiet || (git commit -m "avtala: автообновление $(date -u +%F)" && (git pull --rebase origin main; git push))

      - name: Issue при сбое
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Автообновление калькулятора авталы не смогло получить данные.\n\n';
            try { body += '```\n' + fs.readFileSync('/tmp/out.txt','utf8').slice(0,4000) + '\n```'; } catch(e) {}
            body += '\n\nСтраница работает на последних сохранённых данных.';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state:'open', labels:'avtala' });
            if (open.data.length) await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ owner, repo, title:'Автала: источники недоступны', body, labels:['avtala'] });