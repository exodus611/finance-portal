name: Еженедельный дайджест

on:
  schedule:
    # Каждый понедельник в 06:00 UTC — после того как обновится табло
    # и данные о мошенничестве за прошедшую неделю.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать дайджест
        id: run
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/update_digest.py | tee /tmp/out.txt

      - name: Сохранить изменения
        run: |
          git config user.name "finance-portal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/digest.json
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Еженедельный дайджест: $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
