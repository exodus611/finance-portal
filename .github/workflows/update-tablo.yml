name: Tablo — auto update

on:
  schedule:
    - cron: '30 6 * * 1-5'    # будни 06:30 UTC (09:30 по Израилю летом)
    - cron: '30 12 * * 1-5'   # добор днём
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Установить зависимости
        run: pip install openpyxl

      - name: Обновить данные
        id: run
        continue-on-error: true
        run: python scripts/tablo_update.py | tee /tmp/out.txt

      - name: Закоммитить
        run: |
          git config user.name  "tablo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tablo.json
          git diff --staged --quiet || (git commit -m "tablo: обновление $(date -u +%F)" && git push)

      - name: Issue при сбое
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Обновление табло не смогло получить данные.\n\n';
            try { body += '```\n' + fs.readFileSync('/tmp/out.txt','utf8').slice(0,4000) + '\n```'; } catch(e) {}
            body += '\n\nСтраница работает на последних сохранённых данных.';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state:'open', labels:'tablo' });
            if (open.data.length) await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ owner, repo, title:'Табло: источники недоступны', body, labels:['tablo'] });