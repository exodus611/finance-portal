# Автообновление модуля «Дира бе-ханаха».
name: Обновление данных «Дира бе-ханаха»

on:
  schedule:
    # Ежедневно в 05:20 по всемирному времени.
    # Реестр проектов меняется без предупреждения, поэтому проверяем каждый день.
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обновить данные
        run: python3 scripts/dira_update.py

      - name: Проверить целость файла данных
        run: python3 -m json.tool data/dira.json > /dev/null

      - name: Пересобрать статичную разметку
        run: python3 scripts/dira_prerender.py

      - name: Сохранить изменения
        run: |
          git config user.name "finance-portal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/dira.json dira.html
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Дира бе-ханаха: обновление за $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi