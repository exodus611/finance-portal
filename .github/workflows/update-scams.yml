name: Обновление хроники мошенничества

on:
  schedule:
    # Раз в день в 05:45 UTC. Публикации в канале выходят примерно раз в 2-3 дня,
    # поэтому ежедневный запуск гарантированно ловит новые посты без лишней нагрузки.
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install deep-translator

      - name: Обновить данные
        id: run
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/update_scams.py | tee /tmp/out.txt

      - name: Проверить целость файла данных
        run: python3 -m json.tool data/scams.json > /dev/null

      - name: Сохранить изменения
        run: |
          git config user.name "finance-portal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scams.json
          if git diff --staged --quiet; then
            echo "Новых предупреждений нет — изменений не было"
          else
            git commit -m "Хроника мошенничества: автообновление $(date +%Y-%m-%d)"
            # На случай, если пока мы работали, кто-то ещё (например, ручная
            # загрузка zip) успел запушить в main — подтягиваем свежие
            # изменения и перекладываем наш коммит поверх них, вместо того
            # чтобы просто упасть с "rejected".
            git pull --rebase origin main
            git push
          fi

      - name: Issue при сбое
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Автообновление хроники мошенничества не смогло выполниться.\n\n';
            try { body += '```\n' + fs.readFileSync('/tmp/out.txt','utf8').slice(0,4000) + '\n```'; } catch(e) {}
            body += '\n\nСтраница работает на последних сохранённых данных.';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'scams' });
            if (open.data.length) await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ owner, repo, title: 'Хроника мошенничества: сбой автообновления', body, labels: ['scams'] });
