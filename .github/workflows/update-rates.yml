name: Обновление ставок (Банк Израиля / ЦСБ)

on:
  schedule:
    # Каждый день в 06:00 UTC (примерно 09:00 по Израилю зимой, 08:00 летом)
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # кнопка ручного запуска в вкладке Actions

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Запуск скрипта обновления ставок
        run: python scripts/update-rates.py

      - name: Коммит изменений (если есть)
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data/rates.json
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен."
          else
            git commit -m "Автообновление ставок: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
